    description: "Keeps the evidence for every coordinator role’s KPIs in one place. Each item is logged against KPI and responsibility codes, and an AI “Analyse” button suggests which KPIs a description supports. A roadmap module rates progress on the ISP Futures roadmaps across campuses as Aligned, Partial or Needs Work. A “Needs evidence” queue shows the gaps, and weekly reports and the full portfolio export to PDF or Markdown."
