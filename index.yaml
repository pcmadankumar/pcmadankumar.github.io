projects:
  - name: "Professional Development Analytics & the Six-Pillar Framework"
    category: "Teacher Professional Development Projects"
    period: "2025 – Present"
    status: ["Status: updated periodically"]
    status_note: "Detailed presentation with activities, prepared and updated periodically"
    tech: ["Training Analytics", "NPS & Confidence Model", "Six-Pillar Framework", "Impact Reporting", "Newsletter"]
    description: "The data layer behind a four-campus teacher-training programme. Each cycle: training-hours dashboards per campus and section, honour rolls extracted from the school information system, a six-pillar classification of about 1,000 external trainings with the portals behind each, and a post-session impact model that pairs before-and-after confidence with Net Promoter Score to rank sessions. Co-authored the six-pillar professional development framework that moved appraisal from three \"buckets\" to six measurable pillars, and the trainer benefit policy that rewards teachers who learn 50+ hours and deliver 4–6. Findings are published in a monthly training newsletter, where I am part of the editing and design team."
  - name: "Multilingualism Teacher Training Workshop"
    category: "Teacher Professional Development Projects"
    period: "2026 – Present"
    status: ["Status: updated periodically"]
    status_note: "Detailed presentation with activities, prepared and updated periodically"
    tech: ["CLIL Framework", "Learning Design", "Scaffolding Strategies", "Workshop Facilitation"]
    description: "A 70+ slide professional development workshop designed to help teachers support multilingual learners, built incrementally from ISP module notes into a full session on Learning Design theory, the CLIL framework, and classroom scaffolding strategies. Includes a real classroom case study, four hands-on activities, a practical teaching-strategy toolkit, and a companion handout for follow-up reflection. Structured as a 3.5-hour in-person session or split across two twilight sessions. Delivered to TIPS teaching staff as part of ongoing pedagogical development."
  - name: "Safeguarding Teacher Training Presentation"
    category: "Teacher Professional Development Projects"
    period: "2026 – Present"
    status: ["Status: updated periodically"]
    status_note: "Detailed presentation with activities, prepared and updated periodically"
    tech: ["Safeguarding", "ISP Compliance", "Teacher Training", "Reporting Procedures"]
    description: "A professional development presentation on student safeguarding, built to meet ISP compliance requirements for all TIPS teaching staff. Developed section by section from official safeguarding source material into a structured, teacher-facing session. Designed to build practical awareness of safeguarding responsibilities and reporting procedures in the classroom. Delivered as part of the standing TIPS PD calendar."
  - name: "CBSE to Cambridge Teacher Induction Programme"
    category: "Teacher Professional Development Projects"
    period: "2026 – Present"
    status: ["Status: updated periodically"]
    status_note: "Detailed presentation with activities, prepared and updated periodically"
    tech: ["Cambridge Curriculum", "Command Words", "Curriculum Planning", "Live Polling", "Online Delivery"]
    description: "An interactive 2-hour induction session for teachers transitioning from the CBSE board to the Cambridge curriculum, covering the shift from rote learning to application-based pedagogy, assessment and command words, and curriculum planning. Delivered online three times, to 50+ Lower Secondary and IGCSE/A Level teachers each time, using live polling and comparison-challenge activities rather than passive slides. Built from original blog research plus official Cambridge guidance. Now being expanded into a self-paced induction series in Microsoft Teams for deeper onboarding."
  - name: "Cambridge Exams Officer Training Modules"
    category: "Teacher Professional Development Projects"
    period: "2026 – Present"
    status: ["Status: updated periodically"]
    status_note: "Detailed presentation with activities, prepared and updated periodically"
    tech: ["Cambridge Handbook 2026", "Exam Administration", "Scenario-Based Learning", "Self-Assessment Quiz", "Centre-Agnostic Edition"]
    description: "A complete three-module training suite built to onboard new Cambridge Exams Officers, developed from the Cambridge Handbook 2026 and shaped by a 20-question scoping survey to reflect real TIPS operating conditions. Covers the full exam administration cycle — entries and fees, coursework moderation, secure storage and despatch, exam day procedures, malpractice, results, and appeals — through 24 realistic scenario exercises and a 70-question self-assessment quiz. Built first to train a new Exams Officer ahead of the November 2026 series, then adapted into a generic, centre-agnostic version suitable for external schools. A free 12-slide taster deck was also produced alongside a commercial listing, exploring the suite as a standalone resource beyond TIPS."
  - name: "Personal Portfolio Website"
    category: "Learning and Research Projects"
    period: "2025 – Present"
    status: ["Status: live"]
    tech: ["HTML5", "CSS3", "JavaScript", "GitHub Pages"]
    url: "https://pcmadankumar.github.io"
    description: "A build-to-learn effort that grew into a fully deployed personal portfolio website on GitHub Pages — showcasing professional experience, skills, certifications, and achievements sourced from a LinkedIn profile export. The site is dark-themed, mobile-responsive, and features smooth scroll animations built entirely with vanilla HTML, CSS, and JavaScript. Deployed via a one-command Windows .bat script with no frameworks, no build tools, and zero hosting cost."
  - name: "Cambridge IGCSE Computer Science Question Bank (0478)"
    category: "Learning and Research Projects"
    period: "2026 – Present"
    status: ["Status: prepared and used"]
    tech: ["Cambridge IGCSE 0478", "Past Paper Analysis", "Knowledge Organisers", "Examiner Reports", "SharePoint"]
    description: "A topic-wise question bank built entirely from official Cambridge IGCSE Computer Science past papers, covering both papers in full across all 10 syllabus topics. Every question is extracted from real question papers and mark schemes, classified by syllabus learning outcome, and tagged by difficulty band — no authored content, only verified past-paper material. Complete at 53 papers and nearly 4,000 marks, with companion knowledge organisers and a command-word exam-technique guide layered in from published examiner reports. Shared with Computer Science teachers across TIPS campuses via SharePoint as a live revision resource."
  - name: "Cambridge AS & A Level Computer Science Question Bank (9618)"
    category: "Learning and Research Projects"
    period: "2026 – Present"
    status: ["Status: prepared and used"]
    tech: ["Python", "Cambridge AS & A Level 9618", "Past Paper Analysis", "Authored Practice Papers", "Topic Worksheets"]
    description: "A topic-wise question bank built the same way as its IGCSE counterpart, extracting and classifying questions from official 9618 past papers by syllabus learning objective and AS/A Level difficulty band. Now expanded well beyond the original bank with dedicated knowledge organisers, an examiner-report-informed command-word guide, topic worksheets, and a full set of authored practice papers built to match the Cambridge exam-series blueprint. Currently mid-build, with recent exam series still being processed and Paper 4 (practical, Python) still to come. Built for the same purpose — giving Computer Science teachers a reliable, syllabus-anchored revision resource."
  - name: "English Practice Paper & Worksheet Library (Lower Secondary, IGCSE ESL & AS Level General Paper)"
    category: "Learning and Research Projects"
    period: "2026 – Present"
    status: ["Status: prepared and used"]
    tech: ["Cambridge Lower Secondary", "IGCSE ESL", "AS Level General Paper", "Original Passages", "Mark Schemes"]
    description: "A cross-level library of original English practice materials built to give students authentic, exam-style rehearsal beyond what past papers alone can offer. Covers Cambridge Lower Secondary Stage 8 English (a complete 22-paper fiction and non-fiction series), IGCSE English as a Second Language, and AS Level English General Paper Section A and B comprehension papers. Every passage is original to avoid copyright issues while mirroring the exact question taxonomy, mark allocation, and levels-of-response grids of the real Cambridge papers. Each paper ships as a full question paper plus a detailed mark scheme, with shorter mini-worksheets built for targeted, single-skill practice. Built to give TIPS English teachers a constantly refreshable bank of exam-realistic material."
  - name: "Future Pathways — Career Guidance Website"
    category: "Future Pathways (FP) & Career Guidance Projects"
    period: "2026 – Present"
    status: ["Status: live"]
    tech: ["Astro", "TypeScript", "GitHub Actions", "GitHub Pages", "Pagefind"]
    url: "https://futurepathways.github.io/"
    description: "A free career-guidance website for students and parents in India, written and run by me. Plain-language guides on careers, courses, countries, universities and opportunities sit alongside Career Roadmaps that map roles to school subjects, degrees and entrance exams, an Upcoming Deadlines page with calendar downloads, start-here pages for each grade band, full-text search and saved posts. A daily automatic rebuild keeps every deadline badge current."
  - name: "University & Course Admissions Advisory Series"
    category: "Future Pathways (FP) & Career Guidance Projects"
    period: "2026 – Present"
    status: ["Status: ongoing"]
    tech: ["University Admissions", "Entrance Exams", "Verified Sourcing", "Word", "PDF", "Excel"]
    description: "A growing library of fact-checked advisory documents guiding TIPS students through competitive university and entrance-exam pathways — ESAT, design programmes (NATA/UCEED/NID), Materials Science abroad, Biotechnology in India, and Mathematics syllabus comparisons (SAT vs IPMAT vs Cambridge A Level). Every claim is verified against official university and board portals, never aggregators, with numbered endnotes and a full source list. Each document ships as branded Word, PDF, and an accompanying Excel exam/deadline matrix. Built to give students and parents a single reliable reference instead of scattered forum advice."
  - name: "University Virtual Tour Series"
    category: "Future Pathways (FP) & Career Guidance Projects"
    period: "2026 – Present"
    status: ["Status: in use"]
    tech: ["University Profiles", "QS Global Top 10", "Future Pathway Counselling", "Branded House Style"]
    description: "A 12-part advisory series profiling leading universities — the QS top 10 (MIT, Imperial, Stanford, Oxford, Harvard, Cambridge, Caltech, ETH Zurich, UCL and NUS) plus Yale and Princeton — covering academics, admissions, and student life. Each guide follows a consistent branded house style and is built to walk students through what a virtual campus visit can’t always convey. An additional addendum covers NUS and NTU admissions specifically. Used as a standing reference for Future Pathways counselling across all four campuses."
  - name: "Dhruv — Personal OS"
