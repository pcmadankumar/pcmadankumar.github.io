      design programmes (NATA/UCEED/NID), Materials Science abroad, Biotechnology in India, and
      Mathematics syllabus comparisons (SAT vs IPMAT vs Cambridge A Level). Every claim verified
      against official university and board portals, with numbered endnotes and a full source list.
  - name: ISP University Virtual Tour Series
    tech: ["University Profiles", "QS Global Top 10", "Future Pathway Counselling"]
    period: "2026 – Present"
    description: >
      12-part advisory series profiling QS Global Top 10 universities including MIT, Caltech, Yale,
      and Princeton across academics, admissions, and student life, plus an NUS/NTU admissions addendum.
      Used as a standing reference for Future Pathway counselling across all four TIPS campuses.
  - name: Multilingualism Teacher Training Workshop
    tech: ["CLIL Framework", "Learning Design", "Scaffolding Strategies", "Workshop Facilitation"]
    period: "2026 – Present"
    description: >
      70+ slide professional development workshop on supporting multilingual learners, covering Learning
      Design theory, the CLIL framework, and classroom scaffolding. Includes a classroom case study,
      four activities, a strategy toolkit, and a reflection handout. Runs as a 3.5-hour session or
      two twilight sessions.
  - name: Safeguarding Teacher Training Presentation
    tech: [Safeguarding, "ISP Compliance", "Teacher Training", "Reporting Procedures"]
    period: "2026 – Present"
    description: >
      Professional development presentation on student safeguarding, built to meet ISP compliance
      requirements for all TIPS teaching staff. Builds practical awareness of safeguarding
      responsibilities and reporting procedures in the classroom.
  - name: CBSE to Cambridge Teacher Induction Programme
    tech: ["Cambridge Curriculum", "Command Words", "Curriculum Planning", "Live Polling"]
    period: "2026 – Present"
    description: >
      Interactive 2-hour online induction for teachers moving from CBSE to the Cambridge curriculum,
      covering application-based pedagogy, assessment and command words, and curriculum planning,
      delivered with live polling. Being expanded into a self-paced induction series in Microsoft Teams.
  - name: Cambridge Exams Officer Training Modules
    tech: ["Cambridge Handbook 2026", "Exam Administration", "Scenario-Based Learning"]
    period: "2026 – Present"
    description: >
      Three-module training suite for new Cambridge Exams Officers, developed from the Cambridge
